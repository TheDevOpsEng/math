<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Math Quest</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="no-transitions">
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <div class="level-container">
                    <span id="level">Level 1</span>
                    <div class="daily-note" id="daily" hidden></div>
                </div>
                <h1><span id="buddy" aria-hidden="true"></span> <span class="title-text">Math Quest</span></h1>
                <div class="menu-container">
                    <button type="button" class="menu-btn" id="menu-toggle-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu-dropdown">☰</button>
                    <div class="menu-dropdown" id="menu-dropdown">
                        <button type="button" class="menu-item" id="achievements-btn">🏅 Achievements</button>
                        <button type="button" class="menu-item" id="shop-btn">🛍️ Shop</button>
                        <button type="button" class="menu-item" id="hint-btn">💡 Get a Hint</button>
                        <button type="button" class="menu-item" id="restart-btn">🔄 Restart</button>
                        <button type="button" class="menu-item" id="dark-mode-btn">🌙 Dark Mode</button>
                        <button type="button" class="menu-item" id="mute-btn">🔇 Mute</button>
                    </div>
                </div>
            </div>
            <div class="stats">
                <div id="streak" aria-label="Answer streak">🔥 0</div>
                <div id="score" aria-label="Score">⭐ 0</div>
                <div id="coins" aria-label="Coins">💰 0</div>
                <div id="timer" aria-label="Time this round">0s</div>
            </div>
            <div class="operations-container" id="operations-container" role="group" aria-label="Operation">
                <button type="button" class="op-btn active" data-operation="addition" aria-label="Addition" aria-pressed="true">+</button>
                <button type="button" class="op-btn" data-operation="subtraction" aria-label="Subtraction" aria-pressed="false">−</button>
                <button type="button" class="op-btn" data-operation="multiplication" aria-label="Multiplication" aria-pressed="false">×</button>
                <button type="button" class="op-btn" data-operation="division" aria-label="Division" aria-pressed="false">÷</button>
                <button type="button" class="op-btn" data-operation="pemdas" aria-label="Order of operations" aria-pressed="false">( )</button>
            </div>
        </div>

        <!-- Main Game Area -->
        <div class="game-area">
            <div class="progress-bar-container" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="question-card" id="question-card" aria-live="polite">
                <span id="question-text"></span>
                <div class="answer-display" id="answer-display"></div>
                <div class="feedback-text" id="feedback-text"></div>
                <div class="combo-badge" id="combo-badge" hidden></div>
            </div>
            <div class="input-area">
                <div class="numpad-container" id="numpad">
                    <button type="button" class="numpad-btn" data-key="1">1</button>
                    <button type="button" class="numpad-btn" data-key="2">2</button>
                    <button type="button" class="numpad-btn" data-key="3">3</button>
                    <button type="button" class="numpad-btn" data-key="4">4</button>
                    <button type="button" class="numpad-btn" data-key="5">5</button>
                    <button type="button" class="numpad-btn" data-key="6">6</button>
                    <button type="button" class="numpad-btn" data-key="7">7</button>
                    <button type="button" class="numpad-btn" data-key="8">8</button>
                    <button type="button" class="numpad-btn" data-key="9">9</button>
                    <button type="button" class="numpad-btn function" data-key="." aria-label="Decimal point">.</button>
                    <button type="button" class="numpad-btn" data-key="0">0</button>
                    <button type="button" class="numpad-btn function" data-key="backspace" aria-label="Backspace">⌫</button>
                </div>
                <button type="button" class="submit-btn-main" id="submit-btn">Check</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="message-modal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <div id="modal-achievements-container"></div>
            <button type="button" id="modal-ok-btn">OK</button>
        </div>
    </div>

    <div id="confetti" aria-hidden="true"></div>
    <div id="toast-container" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
